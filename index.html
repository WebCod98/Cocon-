<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cocon — votre nid à distance</title>
    <meta
      name="description"
      content="Cocon : l'application des couples à distance. Une mascotte partagée, vos rituels du matin et du soir, un Polaroid de 24 h, votre compteur d'amour et 15 mini-jeux à deux." />

    <!-- Polices chargees sans bloquer le rendu : `media=print` puis bascule
         a `all` une fois la feuille recue. Le `noscript` couvre le reste. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'" />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" />
    </noscript>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFF6F8" id="theme-color-meta" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Plein écran une fois ajoutée à l'écran d'accueil iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cocon" />

    <script>
      // Applique le thème mémorisé avant le premier rendu : pas de flash blanc la nuit.
      try {
        var saved = localStorage.getItem('cocon.theme');
        if (saved === 'night') {
          document.documentElement.setAttribute('data-theme', 'night');
          document.getElementById('theme-color-meta').setAttribute('content', '#1A121F');
        }
      } catch (error) {
        /* stockage indisponible : on reste en thème jour */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
